# Build and deploy static site to GitHub Pages (Vite).
# Repo settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Project site: https://lucasgualtieri.github.io/cg_tp01/
      # Since the repo is <user>.github.io/<repo>, set GITHUB_PAGES_BASE to /cg_tp01/
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /cg_tp01/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
